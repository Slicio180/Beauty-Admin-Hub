<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Event Manager · Development</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand">AIK DART <span>EVENT MANAGER</span></div><div class="environment">ISOLATED DEVELOPMENT · SYNTHETIC DATA</div></header>
<div class="shell"><aside><p class="nav-label">MANAGE EVENT</p><nav aria-label="Event sections"><button data-view="overview">Overview</button><button data-view="pools">Pools & qualifiers</button><button data-view="guide">Qualification guide</button><button data-view="brackets">Slutspel</button><button data-view="boards">Boards & badges</button><button data-view="matches">Matches</button><button data-view="settings">Event settings</button><button data-view="audit">Audit</button></nav><div class="sidebar-note">Separate project<br>Hub integration pending</div></aside>
<main><div class="page-heading"><div><p class="eyebrow">EVENT CONTROL</p><h1 id="heading">Overview</h1><p id="event-title"></p></div><button id="refresh">Refresh</button></div><p id="notice" role="status" aria-live="polite">Loading rehearsal…</p><section id="content"></section></main></div>
<dialog id="review"><h2>Review change</h2><p id="review-description"></p><pre id="review-details"></pre><label class="approval"><input type="checkbox" id="approval"> I approve this rehearsal change.</label><div class="actions"><button id="confirm" disabled>Confirm change</button><button id="cancel">Cancel</button></div><p id="review-status" role="status"></p></dialog><script src="/app.js"></script></body></html>
