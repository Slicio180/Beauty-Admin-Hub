<!DOCTYPE html>
<html lang="sv">

<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="https://aik-dart-kiosk-icon.alessiotampella.workers.dev/">
<link rel="apple-touch-icon" href="https://aik-dart-kiosk-icon.alessiotampella.workers.dev/">
  <style>

    /* =====================================================
       AIK MÅNDAGSDARTARNA KIOSK
       FINAL APPROVED DESIGN
       ===================================================== */

    @font-face {
  font-family: 'AIK Display';
  src: url('https://aik-dart-fonts.alessiotampella.workers.dev/AIKDisplay-Bold.woff2%20copy')
       format('woff2');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'AIK Display Light';
  src: url('https://aik-dart-fonts.alessiotampella.workers.dev/AIKDisplay-Light.woff2%20copy')
       format('woff2');
  font-weight: 300;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: 'AIK Condensed';
  src: url('https://aik-dart-fonts.alessiotampella.workers.dev/AIKDisplay-CondensedBold.woff2%20copy')
       format('woff2');
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

    :root {
      --black: #000000;
      --gold: #FFD700;
      --white: #FFFFFF;
      --grey: #777777;
      --light-grey: #BDBDBD;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--black);
      color: var(--white);
      font-family: 'AIK Display Light', sans-serif;
      font-weight: 300;
    }

    body {
      min-height: 100vh;
    }


    /* =====================================================
       MAIN PAGE
       ===================================================== */

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 10px 20px 32px;
      background: var(--black);
    }

    .container {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
    }


    /* =====================================================
       BRANDING
       ===================================================== */

    .branding {
      width: 100%;
      padding: 0 20px 16px;
      text-align: center;
      background: var(--black);
    }

    .brand-image {
      display: block;
      width: 100%;
      max-width: 650px;
      height: auto;
      margin: 0 auto;
      object-fit: contain;
      background: var(--black);
    }


    /* =====================================================
       ANMÄLAN
       AIK CONDENSED BOLD
       ===================================================== */

    .registration-title {
      margin: 8px 0 2px;
      color: var(--gold);

      font-family: 'AIK Condensed', sans-serif;
      font-size: 31px;
      line-height: 1;
      font-weight: 700;

      letter-spacing: 6px;
      text-transform: uppercase;
    }


    /* =====================================================
       WHITE FORM CARD
       ===================================================== */

    .card {
      width: 100%;
      padding: 26px 38px;

      background: var(--white);
      color: var(--black);

      border: 2px solid var(--gold);
      border-radius: 18px;

      box-shadow: 0 14px 45px rgba(0,0,0,.60);
    }

    .field {
      margin-bottom: 26px;
    }


    /* =====================================================
       BLACK HEADING BOXES
       AIK DISPLAY BOLD
       ===================================================== */

    .label {
      display: inline-block;

      margin-bottom: 10px;
      padding: 7px 14px 6px;

      background: var(--black);
      color: var(--white);

      border-radius: 7px;

      font-family: 'AIK Display', sans-serif;
      font-size: 25px;
      line-height: 1;
      font-weight: 700;

      text-transform: uppercase;
    }

    .required {
      color: var(--gold);
      font-family: 'AIK Display', sans-serif;
      font-weight: 700;
    }
/* =====================================================
   CUSTOM SEARCHABLE PLAYER DROPDOWN
   ===================================================== */

.player-dropdown {
  position: relative;
  width: 100%;
}

.player-dropdown-button {
  width: 100%;
  min-height: 58px;
  padding: 12px 20px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  border: 2px solid var(--gold);
  border-radius: 10px;

  background: var(--black);
  color: var(--gold);

  font-family: 'AIK Condensed', sans-serif !important;
  font-size: 24px;
  font-weight: 700;

  text-align: left;
  cursor: pointer;
}

.player-dropdown-button:focus {
  outline: none;
  box-shadow: 0 0 0 3px rgba(255,215,0,.22);
}

.player-dropdown-arrow {
  margin-left: 15px;
  font-size: 16px;
}

.player-dropdown-menu {
  display: none;

  width: 100%;
  max-height: 360px;
  overflow-y: auto;

  margin-top: 6px;
  padding: 10px;

  border: 2px solid var(--gold);
  border-radius: 10px;

  background: var(--black);

  box-shadow: 0 10px 30px rgba(0,0,0,.35);
}

.player-dropdown-menu.open {
  display: block;
}

.player-option {
  width: 100%;
  padding: 12px 14px;

  border: 0;
  border-bottom: 1px solid #333333;

  background: var(--black);
  color: var(--gold);

  font-family: 'AIK Condensed', sans-serif !important;
  font-size: 22px;
  font-weight: 700;

  text-align: left;
  cursor: pointer;
}

.player-option:last-child {
  border-bottom: 0;
}

.player-option:hover {
  background: #181818;
}

.player-option.new-player-option {
  margin-bottom: 8px;

  border: 2px solid var(--gold);
  border-radius: 7px;

  color: var(--white);
}
/* =====================================================
   PLAYER SEARCH
   ===================================================== */

.player-search {
  width: 100%;
  min-height: 58px;

  margin-bottom: 12px;
  padding: 12px 18px;

  border: 2px solid var(--gold);
  border-radius: 10px;

  background: var(--black);
  color: var(--gold);

  font-family: 'AIK Condensed', sans-serif !important;
  font-size: 23px;
  font-weight: 700;
}

.player-search:focus {
  outline: none;
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(255,215,0,.22);
}

.player-search::placeholder {
  color: var(--light-grey);

  font-family: 'AIK Display Light', sans-serif !important;
  font-size: 19px;
  font-weight: 300;

  opacity: 1;
}

.new-player-help {
  margin: 8px 0 14px;

  color: #333333;

  font-family: 'AIK Display Light', sans-serif !important;
  font-size: 18px;
  line-height: 1.35;
  font-weight: 300;
}
    /* =====================================================
       PLAYER DROPDOWN
       AIK CONDENSED BOLD
       ===================================================== */

    select {
      width: 100%;
      min-height: 58px;

      padding: 12px 20px;

      border: 2px solid var(--gold);
      border-radius: 10px;

      background: var(--black);
      color: var(--gold);

      font-family: 'AIK Condensed', sans-serif !important;
      font-size: 24px;
      font-weight: 700;

      cursor: pointer;
    }

    select option {
      background: var(--black);
      color: var(--gold);

      font-family: 'AIK Condensed', sans-serif !important;
      font-size: 21px;
      font-weight: 700;
    }

    select:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(255,215,0,.22);
    }


    /* =====================================================
       NEW PLAYER
       ===================================================== */

    #newPlayerArea {
      display: none;

      margin-top: 18px;
      padding: 18px;

      background: #F3F3F3;

      border-left: 5px solid var(--gold);
      border-radius: 10px;
    }

    #newPlayerArea .label {
      font-family: 'AIK Display', sans-serif;
      font-weight: 700;
    }

    input[type="text"] {
      width: 100%;
      min-height: 58px;

      padding: 12px 18px;

      border: 2px solid var(--black);
      border-radius: 10px;

      background: var(--white);
      color: var(--black);

      /* PLAYER NAME */
      font-family: 'AIK Condensed', sans-serif !important;
      font-size: 23px;
      font-weight: 700;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(255,215,0,.22);
    }

    input[type="text"]::placeholder {
      color: var(--grey);

      font-family: 'AIK Display Light', sans-serif;
      font-size: 19px;
      font-weight: 300;

      opacity: 1;
    }


    /* =====================================================
       PHOTO / VIDEO BUTTONS
       AIK CONDENSED BOLD
       ===================================================== */

    .consent-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .consent-option input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .consent-option label {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 58px;
      padding: 11px 12px;

      border: 2px solid var(--gold);
      border-radius: 10px;

      background: var(--black);
      color: var(--gold);

      text-align: center;

      font-family: 'AIK Condensed', sans-serif !important;
      font-size: 23px;
      line-height: 1;
      font-weight: 700;

      cursor: pointer;

      transition:
        background .15s ease,
        color .15s ease,
        transform .12s ease;
    }

    .consent-option label:hover {
      background: #111111;
    }

    .consent-option input:checked + label {
      background: var(--gold);
      color: var(--black);
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(255,215,0,.20);
    }


    /* =====================================================
       EXPLANATORY TEXT
       AIK DISPLAY LIGHT
       ===================================================== */

    .help {
      margin-top: 10px;

      color: #333333;

      font-family: 'AIK Display Light', sans-serif !important;
      font-size: 17px;
      line-height: 1.35;
      font-weight: 300;
    }


    /* =====================================================
       MESSAGE BOX
       AIK DISPLAY LIGHT
       ===================================================== */

    textarea {
      width: 100%;
      min-height: 105px;

      padding: 14px 18px;

      border: 2px solid var(--light-grey);
      border-radius: 10px;

      background: var(--white);
      color: var(--black);

      font-family: 'AIK Display Light', sans-serif !important;
      font-size: 21px;
      font-weight: 300;

      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(255,215,0,.22);
    }

    textarea::placeholder {
      color: var(--grey);

      font-family: 'AIK Display Light', sans-serif !important;
      font-size: 21px;
      font-weight: 300;

      opacity: 1;
    }


    /* =====================================================
       SKICKA ANMÄLAN
       AIK DISPLAY BOLD
       ===================================================== */

    .submit-button {
      width: 100%;
      min-height: 64px;

      padding: 14px 20px;

      border: 2px solid var(--gold);
      border-radius: 10px;

      background: var(--black);
      color: var(--gold);

      font-family: 'AIK Display', sans-serif !important;
      font-size: 30px;
      line-height: 1;
      font-weight: 700;

      cursor: pointer;

      transition:
        background .15s ease,
        color .15s ease,
        transform .12s ease;
    }

    .submit-button:hover {
      background: var(--gold);
      color: var(--black);
    }

    .submit-button:active {
      transform: scale(.985);
    }

    .submit-button:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }


    /* =====================================================
       LOADING
       ===================================================== */

    #loading {
      padding: 40px 20px;

      color: var(--black);
      text-align: center;

      font-family: 'AIK Display Light', sans-serif;
      font-size: 21px;
      font-weight: 300;
    }


    /* =====================================================
       ERROR
       ===================================================== */

    #errorBox {
      display: none;

      margin-bottom: 24px;
      padding: 16px;

      background: var(--black);
      color: var(--gold);

      border: 2px solid var(--gold);
      border-radius: 10px;

      font-family: 'AIK Display Light', sans-serif;
      font-size: 17px;
      line-height: 1.35;
      font-weight: 300;
    }


    /* =====================================================
       SUCCESS SCREEN
       ===================================================== */

    #successScreen {
      display: none;
      min-height: 100vh;
      background: var(--black);
    }

    .success-wrapper {
      width: 100%;
      max-width: 820px;
      min-height: calc(100vh - 20px);

      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .success-card {
      width: 100%;
      padding: 42px 38px;

      background: var(--black);
      color: var(--white);

      border: 2px solid var(--gold);
      border-radius: 18px;

      text-align: center;

      box-shadow: 0 15px 55px rgba(0,0,0,.65);
    }

    .success-brand {
      display: block;

      width: 100%;
      max-width: 560px;
      height: auto;

      margin: 0 auto 26px;

      object-fit: contain;
      background: var(--black);
    }

    .success-check {
      display: flex;
      align-items: center;
      justify-content: center;

      width: 74px;
      height: 74px;

      margin: 0 auto 22px;

      border: 3px solid var(--gold);
      border-radius: 50%;

      color: var(--gold);

      font-family: 'AIK Display', sans-serif;
      font-size: 40px;
      font-weight: 700;
    }


    /* =====================================================
       TACK FÖR DIN ANMÄLAN
       AIK DISPLAY BOLD
       ===================================================== */

    .success-card h2 {
      margin: 0 0 14px;

      color: var(--gold);

      font-family: 'AIK Display', sans-serif !important;
      font-size: 42px;
      line-height: 1;
      font-weight: 700;
    }


    /* =====================================================
       SUCCESS SECONDARY TEXT
       AIK DISPLAY LIGHT
       ===================================================== */

    .success-card p {
      margin: 0 0 32px;

      color: var(--white);

      font-family: 'AIK Display Light', sans-serif !important;
      font-size: 22px;
      line-height: 1.35;
      font-weight: 300;
    }


    /* =====================================================
       REGISTERED PLAYER NAME
       AIK CONDENSED BOLD
       ===================================================== */

    #registeredPlayer {
      color: var(--gold);

      font-family: 'AIK Condensed', sans-serif !important;
      font-size: 24px;
      font-weight: 700;
    }


    /* =====================================================
       NÄSTA SPELARE
       AIK DISPLAY BOLD
       ===================================================== */

    .next-button {
      width: 100%;
      min-height: 70px;

      padding: 16px 20px;

      border: 2px solid var(--gold);
      border-radius: 10px;

      background: var(--gold);
      color: var(--black);

      font-family: 'AIK Display', sans-serif !important;
      font-size: 31px;
      line-height: 1;
      font-weight: 700;

      cursor: pointer;

      transition:
        background .15s ease,
        transform .12s ease;
    }

    .next-button:hover {
      background: var(--white);
    }

    .next-button:active {
      transform: scale(.985);
    }


    /* =====================================================
       TABLET / MOBILE
       ===================================================== */

    @media (max-width: 700px) {

      .page {
        padding: 12px 10px 28px;
      }

      .branding {
        padding: 0 6px 15px;
      }

      .brand-image {
        max-width: 100%;
      }

      .registration-title {
        font-size: 26px;
        letter-spacing: 4px;
      }

      .card {
        padding: 24px 18px;
        border-radius: 14px;
      }

      .field {
        margin-bottom: 23px;
      }

      .label {
        font-size: 22px;
        padding: 7px 11px 6px;
      }

      select {
        font-size: 21px;
      }

      .consent-options {
        grid-template-columns: 1fr;
        gap: 11px;
      }

      .consent-option label {
        min-height: 58px;
        font-size: 21px;
      }

      .help {
        font-size: 15px;
      }

      textarea,
      textarea::placeholder {
        font-size: 19px;
      }

      .submit-button {
        font-size: 27px;
      }

      .success-card {
        padding: 34px 20px;
        border-radius: 14px;
      }

      .success-brand {
        max-width: 100%;
      }

      .success-card h2 {
        font-size: 35px;
      }

      .success-card p {
        font-size: 19px;
      }

      .next-button {
        font-size: 28px;
      }
    }


    /* =====================================================
       SHORT KIOSK / LAPTOP SCREEN
       ===================================================== */

    @media (min-width: 701px) and (max-height: 850px) {

      .page {
        padding: 4px 20px 22px;
      }

      .branding {
        padding: 0 20px 11px;
      }

      .brand-image {
        max-width: 540px;
      }

      .registration-title {
        margin-top: 6px;
      }

      .card {
        padding: 25px 38px;
      }

      .field {
        margin-bottom: 21px;
      }

      textarea {
        min-height: 90px;
      }

      .submit-button {
        min-height: 62px;
      }
    }

  </style>
</head>


<body>

  <!-- =====================================================
       REGISTRATION SCREEN
       ===================================================== -->

  <div id="registrationScreen" class="page">

    <div class="container">

      <div class="branding">

        <img
  class="brand-image"
  src="https://aik-dart-header.alessiotampella.workers.dev/aik-dart-header.webp"
  alt="AIK Dart Måndagsdartarna">

        <div class="registration-title">
          ANMÄLAN
        </div>

      </div>


      <div class="card">

        <div id="loading">
          LADDAR SPELARLISTA...
        </div>


        <div id="formArea" style="display:none;">

          <div id="errorBox"></div>


          <!-- PLAYER -->

          <div class="field">

            <label class="label" for="playerName">
              VÄLJ DITT NAMN
              <span class="required">*</span>
            </label>


<div class="new-player-help">
  Hittar du inte ditt namn? Välj <strong>MITT NAMN FINNS INTE I LISTAN</strong>
  och skriv sedan ditt fullständiga namn.
</div>
            <!-- CUSTOM SEARCHABLE PLAYER DROPDOWN -->

<div class="player-dropdown">

  <button
    type="button"
    id="playerDropdownButton"
    class="player-dropdown-button"
    onclick="togglePlayerDropdown()">

    <span id="playerDropdownText">Välj...</span>
    <span class="player-dropdown-arrow">▼</span>

  </button>

  <div
    id="playerDropdownMenu"
    class="player-dropdown-menu">

    <input
      type="text"
      id="playerSearch"
      class="player-search"
      autocomplete="off"
      placeholder="Sök ditt namn..."
      oninput="filterPlayers()">

    <div id="playerOptions"></div>

  </div>

  <input
    type="hidden"
    id="playerName"
    value="">

</div>


            <div id="newPlayerArea">

              <label class="label" for="newPlayerName">
                SKRIV DITT FULLSTÄNDIGA NAMN
                <span class="required">*</span>
              </label>

              <input
                type="text"
                id="newPlayerName"
                autocomplete="off"
                placeholder="Förnamn Efternamn">

            </div>

          </div>


          <!-- PHOTO / VIDEO -->

          <div class="field">

            <div class="label">
              FOTO OCH VIDEO
              <span class="required">*</span>
            </div>


            <div class="consent-options">

              <div class="consent-option">

                <input
                  type="radio"
                  id="consentYes"
                  name="consent"
                  value="JA, JAG GODKÄNNER">

                <label for="consentYes">
                  JA, JAG GODKÄNNER
                </label>

              </div>


              <div class="consent-option">

                <input
                  type="radio"
                  id="consentNo"
                  name="consent"
                  value="NEJ, JAG GODKÄNNER INTE">

                <label for="consentNo">
                  NEJ, JAG GODKÄNNER INTE
                </label>

              </div>

            </div>


            <div class="help">
              Ditt svar används för att ange om AIK Dartförening får använda foto och video där du medverkar.
            </div>

          </div>


          <!-- MESSAGE -->

          <div class="field">

            <label class="label" for="message">
              MEDDELANDE
            </label>

            <textarea
              id="message"
              placeholder="Valfritt meddelande"></textarea>

          </div>


          <!-- SUBMIT -->

          <button
            id="submitButton"
            class="submit-button"
            onclick="submitForm()">

            SKICKA ANMÄLAN

          </button>

        </div>

      </div>

    </div>

  </div>



  <!-- =====================================================
       SUCCESS SCREEN
       ===================================================== -->

  <div id="successScreen" class="page">

    <div class="success-wrapper">

      <div class="success-card">

        <img
          class="success-brand"
          src="https://drive.google.com/thumbnail?id=18YugMkZGPnXfj1z53VXAruE-VT8Ichty&sz=w1600"
          alt="AIK Dart Måndagsdartarna">

        <div class="success-check">
          ✓
        </div>

        <h2>
          TACK FÖR DIN ANMÄLAN!
        </h2>

        <p>
          <span id="registeredPlayer"></span>
          är nu registrerad.
        </p>

        <button
          class="next-button"
          onclick="nextPlayer()">

          NÄSTA SPELARE

        </button>

      </div>

    </div>

  </div>



  <!-- =====================================================
       WORKING REGISTRATION LOGIC
       ===================================================== -->

  <script>

    const NEW_PLAYER_OPTION =
      'MITT NAMN FINNS INTE I LISTAN';
let allPlayers = [];

    window.addEventListener('load', loadPlayers);


    function loadPlayers() {

      document.getElementById('loading').style.display = 'block';
      document.getElementById('formArea').style.display = 'none';

      google.script.run

        .withSuccessHandler(function(players) {

          buildPlayerList(players);

          document.getElementById('loading').style.display = 'none';
          document.getElementById('formArea').style.display = 'block';

        })

        .withFailureHandler(function(error) {

          document.getElementById('loading').innerText =
            'KUNDE INTE LADDA SPELARLISTAN';

          showError(
            error.message ||
            'Ett fel uppstod.'
          );

        })

        .getPlayerNames();
    }


    function buildPlayerList(players) {

  allPlayers = players.slice();

  renderPlayerList(allPlayers);
}


function renderPlayerList(players) {

  const options =
    document.getElementById('playerOptions');

  options.innerHTML = '';


  /* NEW PLAYER OPTION ALWAYS FIRST */

  const newPlayerButton =
    document.createElement('button');

  newPlayerButton.type = 'button';
  newPlayerButton.className =
    'player-option new-player-option';

  newPlayerButton.textContent =
    NEW_PLAYER_OPTION;

  newPlayerButton.onclick = function() {
    selectPlayer(NEW_PLAYER_OPTION);
  };

  options.appendChild(newPlayerButton);


  /* NORMAL PLAYER NAMES */

  players.forEach(function(player) {

    if (player === NEW_PLAYER_OPTION) {
      return;
    }

    const button =
      document.createElement('button');

    button.type = 'button';
    button.className = 'player-option';

    button.textContent = player;

    button.onclick = function() {
      selectPlayer(player);
    };

    options.appendChild(button);

  });
}
function togglePlayerDropdown() {

  const menu =
    document.getElementById('playerDropdownMenu');

  menu.classList.toggle('open');

  if (menu.classList.contains('open')) {

    setTimeout(function() {
      document.getElementById('playerSearch').focus();
    }, 100);

  }
}


function selectPlayer(player) {

  document.getElementById('playerName').value = player;

  document.getElementById('playerDropdownText').textContent = player;

  document
    .getElementById('playerDropdownMenu')
    .classList.remove('open');

  document.getElementById('playerSearch').value = '';

  renderPlayerList(allPlayers);

  playerChanged();
}

function filterPlayers() {

  const search =
    document
      .getElementById('playerSearch')
      .value
      .trim()
      .toLowerCase();

  const filteredPlayers =
    allPlayers.filter(function(player) {

      if (player === NEW_PLAYER_OPTION) {
        return false;
      }

      return player
        .toLowerCase()
        .includes(search);

    });

  renderPlayerList(filteredPlayers);


}


    function playerChanged() {

      const selected =
        document.getElementById('playerName').value;

      const newPlayerArea =
        document.getElementById('newPlayerArea');


      if (selected === NEW_PLAYER_OPTION) {

        newPlayerArea.style.display = 'block';

        setTimeout(function() {

          document
            .getElementById('newPlayerName')
            .focus();

        }, 100);

      } else {

        newPlayerArea.style.display = 'none';

        document
          .getElementById('newPlayerName')
          .value = '';

      }
    }


    function submitForm() {

      hideError();

      const selectedName =
        document.getElementById('playerName').value;

      const newName =
        document
          .getElementById('newPlayerName')
          .value
          .trim();

      const consentElement =
        document.querySelector(
          'input[name="consent"]:checked'
        );

      const consent =
        consentElement
          ? consentElement.value
          : '';

      const message =
        document
          .getElementById('message')
          .value
          .trim();


      if (!selectedName) {

        showError('Välj ditt namn.');
        return;

      }


      if (
        selectedName === NEW_PLAYER_OPTION &&
        !newName
      ) {

        showError(
          'Skriv ditt fullständiga namn.'
        );

        return;
      }


      if (!consent) {

        showError(
          'Välj JA eller NEJ för foto och video.'
        );

        return;
      }


      const button =
        document.getElementById('submitButton');

      button.disabled = true;
      button.innerText = 'REGISTRERAR...';


      const data = {
  selectedName: selectedName,
  newName: newName,
  consent: consent,
  message: message,
  source: 'KIOSK'
};


      google.script.run

        .withSuccessHandler(function(result) {

          button.disabled = false;
          button.innerText = 'SKICKA ANMÄLAN';

          if (result && result.success) {

            showSuccess(result.player);

          } else {

            showError(
              'Registreringen kunde inte sparas.'
            );

          }

        })

        .withFailureHandler(function(error) {

          button.disabled = false;
          button.innerText = 'SKICKA ANMÄLAN';

          showError(
            error.message ||
            'Registreringen kunde inte sparas.'
          );

        })

        .submitRegistration(data);
    }


    function showSuccess(player) {

      document
        .getElementById('registeredPlayer')
        .textContent = player;

      document
        .getElementById('registrationScreen')
        .style.display = 'none';

      document
        .getElementById('successScreen')
        .style.display = 'block';

      window.scrollTo(0, 0);
      setTimeout(nextPlayer, 5000);
    }


    function nextPlayer() {

document.getElementById('playerName').value = '';
document.getElementById('playerSearch').value = '';
document.getElementById('newPlayerName').value = '';

document.getElementById('playerDropdownText').textContent = 'Välj...';

document
  .getElementById('playerDropdownMenu')
  .classList.remove('open');

renderPlayerList(allPlayers);

      document
        .getElementById('newPlayerArea')
        .style.display = 'none';


      document
        .querySelectorAll('input[name="consent"]')
        .forEach(function(radio) {

          radio.checked = false;

        });


      document.getElementById('message').value = '';

      hideError();

      document
        .getElementById('successScreen')
        .style.display = 'none';

      document
        .getElementById('registrationScreen')
        .style.display = 'block';

      loadPlayers();

      window.scrollTo(0, 0);
    }


    function showError(message) {

      const errorBox =
        document.getElementById('errorBox');

      errorBox.textContent = message;
      errorBox.style.display = 'block';

      errorBox.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
      });
    }


    function hideError() {

      const errorBox =
        document.getElementById('errorBox');

      errorBox.style.display = 'none';
      errorBox.textContent = '';
    }

  </script>

</body>
