<script>(()=>{'use strict';
 const get=id=>document.getElementById(id),host=get('beautyLiveRecoveryEventControls'),old=get('beautyLiveRecoverySavedArea');if(!host||!old)return;
 const section=document.createElement('section');section.id='beautyPlayerRecovery';section.setAttribute('aria-label','Player registration health');old.before(section);old.hidden=true;
 const summary=document.createElement('p');summary.setAttribute('role','status');summary.textContent='Loading player registration status…';const cards=document.createElement('div');cards.className='beauty-player-health-cards';section.append(summary,cards);
 const dialog=document.createElement('dialog');dialog.id='beautyPlayerRecoveryDialog';dialog.className='beauty-simple-dialog';dialog.setAttribute('aria-labelledby','beautyPlayerRecoveryName');document.body.append(dialog);
 const title=document.createElement('h2');title.id='beautyPlayerRecoveryName';const status=document.createElement('p');status.setAttribute('role','status');const steps=document.createElement('ol'),detail=document.createElement('p'),actions=document.createElement('div'),history=document.createElement('details'),historyTitle=document.createElement('summary'),report=document.createElement('pre');historyTitle.textContent='Advanced';history.className='beauty-simple-advanced';history.append(historyTitle,steps,report);
 const close=document.createElement('button');close.type='button';close.textContent='Close';close.addEventListener('click',()=>dialog.close());const mark=document.createElement('div');mark.setAttribute('aria-hidden','true');status.className='beauty-simple-result';actions.className='beauty-simple-actions';const x=document.createElement('button');x.type='button';x.className='beauty-simple-close';x.textContent='×';x.setAttribute('aria-label','Close issue');x.addEventListener('click',()=>dialog.close());dialog.append(x,title,mark,status,detail,actions,history);dialog.addEventListener('close',()=>{history.open=false;});
 let state=null,busy=false,epoch=0,selected='',guidance=null,lastRead=0,unlocked=false,queued=false,notice='',currentContext='',providerPaused=false;
 const labels={red:'Needs your help',orange:'Beauty is checking',green:'Verified',unknown:'Automatic check pending',neutral:'Not IN'};
 function addButton(label,fn,parent=actions){const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',fn);parent.append(b);return b;}
 function reportText(p){return ['Beauty player recovery', 'Event: '+state.title+' · '+state.eventDate,'Player: '+p.name,'Status: '+labels[p.tone],'Issue: '+p.code,'Next: '+p.next,'Last entry check: '+(p.checkedAt||'Not confirmed'),'Entry verification: '+(p.entry?JSON.stringify(p.entry):'See the current check; no recovery entry record'),'Original registration: '+(p.original?JSON.stringify(p.original):'No diagnostic available'),...(p.history||[]).map(h=>h.at+' · '+h.source+' · '+h.state+' · '+h.code)].join('\n');}
 function goToPlayer(name){dialog.close();get('beautyRecoveryLivePanel')?.close();get('dashboardNavButton')?.click();const cell=[...document.querySelectorAll('[data-beauty-health-player]')].find(c=>c.dataset.beautyHealthPlayer===name);cell?.scrollIntoView?.({block:'center'});cell?.closest?.('tr')?.querySelector('select')?.focus();}
 const shortReasons={REGISTRATION_REVIEW:'The saved registration needs checking.',SAVED_OPERATION_REVIEW:'The saved operation needs checking.',LEAGUE_CREATION_REVIEW_REQUIRED:'The league profile needs review. Do not create another one.',EVENT_REGISTRATION_CLOSED:'Registration is closed. This saved registration needs review.',MISSING_EVENT_ENTRY:'The player is missing from Nakka.',LEAGUE_IDENTITY_REVIEW:'The player profile could not be confirmed.',IDENTITY_CONFLICT:'More than one player entry matches.',HUB_IDENTITY_REVIEW:'The Hub registration needs review.',REMOVE_REVIEW_REQUIRED:'The removal needs review. Do not remove again.',REMOVE_UNCERTAIN:'The removal could not be confirmed. Do not remove again.',NAKKA_UNAVAILABLE:'Nakka could not be reached.',PLAYER_NOT_ELIGIBLE:'Check this player’s IN / OUT status.',TEST_TARGET_ONLY:'Check the selected event and date.'};
 function renderDialog(){if(!dialog.open)return;
  const p=state?.players.find(p=>p.name===selected),g=guidance?.player===selected?guidance:null;
  title.textContent=selected;title.hidden=false;status.textContent='Issue not solved';detail.textContent='';detail.hidden=false;steps.replaceChildren();actions.replaceChildren();history.hidden=false;
  mark.className='beauty-simple-mark warning';mark.textContent='!';dialog.dataset.tone=p?.tone||'red';dialog.setAttribute('aria-busy',String(busy));
  report.textContent=(p?reportText(p):'Player: '+selected+'\nPlayer no longer in the current result.')+(notice?'\nLatest check: '+notice:'')+(g?'\nGuidance: '+JSON.stringify(g,(key,value)=>key==='ticket'?undefined:value,null,2):'');
  for(const text of g?.steps||[]){const li=document.createElement('li');li.textContent=text;steps.append(li);}
  if(busy&&!notice&&p?.code!=='EVENT_REGISTRATION_CLOSED'){status.textContent='Checking…';mark.className='beauty-simple-mark checking';mark.textContent='';detail.hidden=true;history.hidden=true;return;}
  if(p?.tone==='green'&&!notice&&!providerPaused){title.hidden=true;status.textContent='Issue solved';mark.className='beauty-simple-mark success';mark.textContent='✓';detail.hidden=true;history.hidden=true;return;}
  if(!p){detail.textContent='This player is no longer on the current list. Review the saved issue.';addButton('Resolve issue',()=>goToPlayer(selected));}
  else if(p.code==='EVENT_REGISTRATION_CLOSED'){detail.textContent=shortReasons.EVENT_REGISTRATION_CLOSED;addButton('Resolve issue',()=>{history.open=true;});}
  else if(['REMOVE_REVIEW_REQUIRED','REMOVE_UNCERTAIN'].includes(p.code)){detail.textContent=shortReasons[p.code];addButton('Resolve issue',()=>run('review',{player:p.name}));}
  else if(notice||providerPaused){detail.textContent=busy?'Still waiting for a reply.':'The current result could not be confirmed.';const retry=addButton('Resolve issue',()=>run('read'));retry.disabled=busy;}
  else if(p.tone==='unknown'||p.tone==='orange'){status.textContent='Checking…';mark.className='beauty-simple-mark checking';mark.textContent='';detail.hidden=true;history.hidden=true;return;}
  else if(p.tone==='neutral'){detail.textContent='Check this player’s IN / OUT status.';addButton('Resolve issue',()=>goToPlayer(p.name));}
  else if(g?.ticket&&Date.now()<g.expires){
   // This click is the existing explicit confirmation. State its effect before it can run.
   detail.textContent=g.code==='REVIEW_PROFILE'?'Confirm this is the correct league profile for '+p.name+'.':g.code==='REVIEW_EXISTING'?'Confirm this is the correct Nakka entry for '+p.name+'.':g.kind==='league'?'Create the league profile for '+p.name+'?':'Add '+p.name+' to '+(g.event?.title||state.title)+'?';
   addButton('Resolve issue',()=>{if(busy||!guidance?.ticket)return;const review=guidance;if(Date.now()>=review.expires){guidance=null;run('review',{player:p.name});return;}guidance=null;run('confirm',{player:p.name,kind:review.kind,ticket:review.ticket,confirmed:'true'});});
  }else{
   detail.textContent=shortReasons[p.code]||'The Nakka entry could not be confirmed.';
   addButton('Resolve issue',()=>run('review',{player:p.name}));
  }
  const primary=actions.querySelector('button');if(primary)primary.className='beauty-simple-primary';actions.append(close);
  // Optional source link and all IDs, history and copying stay under Advanced.
  for(const el of [...history.querySelectorAll('a,button')])el.remove();
  if(g?.event?.id&&/^t_[A-Za-z0-9_]+$/.test(g.event.id)){const a=document.createElement('a');a.href='https://n01darts.com/n01/league/season.php?id='+encodeURIComponent(g.event.id);a.target='_blank';a.rel='noopener noreferrer';a.textContent='Open event in Nakka';history.append(a);}
  addButton('Copy report',async()=>{try{await navigator.clipboard.writeText(report.textContent);}catch(e){history.open=true;}},history);
 }
 function open(name){const target=state?.players.find(p=>p.name===name);if(!target||!(['red','orange'].includes(target.tone)||(target.tone==='green'&&target.history?.length)))return;selected=name;notice='';history.open=false;if(guidance?.player!==name)guidance=null;if(!dialog.open)dialog.showModal();renderDialog();const p=state?.players.find(p=>p.name===name);if(p?.tone==='red'&&p.code!=='EVENT_REGISTRATION_CLOSED'&&!guidance&&!busy)run('review',{player:name});}
 function paintCell(cell){
  const name=cell.dataset.beautyHealthPlayer,p=state?.players.find(p=>p.name===name);let badge=cell.querySelector('.beauty-player-recovery-badge');
  const visible=p&&!(providerPaused&&p.tone==='green')&&(['red','orange'].includes(p.tone)||(p.tone==='green'&&p.history?.length));
  if(!visible){if(badge)badge.remove();return;}
  if(!badge){badge=addButton('',()=>open(name),cell);badge.className='beauty-player-recovery-badge';}
  badge.dataset.tone=p.tone;badge.textContent=p.tone==='red'?'Needs help':p.tone==='orange'?'Checking':'Resolved';
  badge.setAttribute('aria-label',name+': '+badge.textContent+'. Open recovery details.');
 }
 function paintTable(){for(const cell of document.querySelectorAll('[data-beauty-health-player]'))paintCell(cell);}
 function render(){cards.replaceChildren();if(!state){summary.textContent=notice||'Waiting for the current event check.';renderDialog();return;}const red=state.players.filter(p=>p.tone==='red').length,orange=state.players.filter(p=>p.tone==='orange').length,unknown=state.players.filter(p=>p.tone==='unknown').length;
  summary.textContent=notice||(providerPaused?'The event connection is not verified. Saved registrations are retained.':'')||state.system||(red?red+' player'+(red===1?' needs':'s need')+' your help.':orange? 'Beauty is checking '+orange+' player'+(orange===1?'':'s')+'.':unknown?'Beauty is checking this event automatically. You do not need to verify players.':state.players.some(p=>p.status==='IN')?'No player issues found. No action needed.':'No IN players to check.');
  for(const p of state.players.filter(p=>['red','orange'].includes(p.tone)||(p.tone==='green'&&p.history?.length)).sort((a,b)=>['red','orange','unknown','green','neutral'].indexOf(a.tone)-['red','orange','unknown','green','neutral'].indexOf(b.tone))){const b=addButton(p.name+' · '+labels[p.tone],()=>open(p.name),cards);b.className='beauty-player-health';b.dataset.tone=providerPaused&&p.tone==='green'?'unknown':p.tone;}
  document.dispatchEvent(new CustomEvent('beauty-player-recovery-state',{detail:{context:currentContext,players:state.players,unavailable:providerPaused}}));paintTable();renderDialog();
 }
 async function run(action,input={}){
  if(action==='auto'&&(!unlocked||document.hidden))return;
  if(busy){if(action==='read')queued=true;return;}
  let token,generation,context;try{token=window.BeautyHubAuth.token();generation=window.BeautyHubAuth.generation();context=window.beautyHubData?.eventContext;if(!context)return;}catch(e){return;}
  const turn=epoch;busy=true;notice='';renderDialog();
  let timer;const valid=()=>turn===epoch&&window.BeautyHubAuth.isCurrent(generation)&&window.beautyHubData?.eventContext===context;
  timer=setTimeout(()=>{if(valid()){notice='The reply is taking longer than expected. Beauty is waiting; do not register again.';render();}},60000);
  try{const r=await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(()=>reject(Error('Reply unavailable. The saved operation will be checked; do not register again.'))).beautyHubTest('playerRecovery:'+action,{_context:context,...input},token));
   if(!valid())return;if(r?.code==='AUTH_REQUIRED'){window.BeautyHubAuth.expired();return;}if(!r?.success)throw Error(r?.error||'The saved result could not be checked.');
   if(r.eventContext!==context||!Array.isArray(r.players))throw Error('The selected event changed. Waiting for its current status.');
   state=r;currentContext=context;lastRead=Date.now();notice='';providerPaused=false;if(r.guidance)guidance=r.guidance;else if(action!=='read')guidance=null;
  }catch(e){if(valid()){notice=e.message;providerPaused=true;}}
  finally{clearTimeout(timer);if(turn===epoch){busy=false;render();if(action!=='read'&&!notice){void loadBeautyHubData();window.BeautyNakkaMonitor?.refresh();}if(queued){queued=false;setTimeout(()=>run('read'),500);}else if(!notice&&!providerPaused&&unlocked&&!document.hidden){const next=state?.players.find(p=>p.autoEligible);if(next)setTimeout(()=>run('auto',{player:next.name}),500);}}}
 }
 function sync(){const context=window.beautyHubData?.eventContext;if(context!==currentContext){epoch++;busy=false;state=null;guidance=null;selected='';notice='';currentContext=context;lastRead=0;providerPaused=false;queued=false;if(dialog.open)dialog.close();render();}if(unlocked&&!document.hidden&&Date.now()-lastRead>10000)run('read');}
 document.addEventListener('beauty-menu-data',sync);
 document.addEventListener('beauty-hub-opened',()=>{unlocked=true;sync();});
 document.addEventListener('beauty-hub-locked',()=>{unlocked=false;epoch++;busy=false;queued=false;state=null;guidance=null;selected='';notice='';currentContext='';if(dialog.open)dialog.close();cards.replaceChildren();report.textContent='';summary.textContent='Sign in to view player status.';});
 get('beautyRecoveryNavButton')?.addEventListener('click',()=>{if(!unlocked)return;run('read');});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&unlocked)sync();});
 window.BeautyPlayerRecovery=Object.freeze({open,refresh:()=>run('read'),cell:(cell,name)=>{cell.dataset.beautyHealthPlayer=name;paintCell(cell);}});
 try{window.BeautyHubAuth.token();unlocked=!!window.beautyHubData;}catch(e){}
 if(unlocked)sync();
})();
</script>
