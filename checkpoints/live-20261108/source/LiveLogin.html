<!doctype html>
<html lang="en"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{background:#080f12;color:#fff;font:18px system-ui;margin:0;padding:40px 20px}main{max-width:440px;margin:40px auto;border:1px solid #ffe12b;border-radius:12px;padding:28px}h1{color:#ffe12b;font-size:28px}label{display:block;margin:18px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit;border-radius:6px}input{background:#101c22;color:white;border:1px solid #687b84}button{background:#ffe12b;color:#080f12;border:0;margin-top:20px;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.5}#status{white-space:pre-wrap}small{color:#b9c4ca}
</style></head><body><main><h1>Beauty — LIVE login check</h1><p>Verify your Hub account. Event controls are not installed yet.</p>
<form id="login"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">Sign in</button></form>
<button id="logout" hidden>Sign out</button><p id="status" role="status" aria-live="polite"></p><small>No registration or event data is changed by this check.</small></main>
<script>
'use strict';
let session=null;
const form=document.getElementById('login'),submit=document.getElementById('submit'),logout=document.getElementById('logout'),status=document.getElementById('status');
function rpc(action,input){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>r&&r.success?resolve(r):reject(Error(r&&r.code||'AUTH_UNAVAILABLE'))).withFailureHandler(()=>reject(Error('SERVER_UNAVAILABLE'))).beautyHubAuth(action,input));}
form.addEventListener('submit',async e=>{
 e.preventDefault();submit.disabled=true;status.textContent='Checking account…';
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
 try{
  let body=JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value,returnSecureToken:true});
  document.getElementById('password').value='';
  const response=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=AIzaSyCNSoes3UvCM7Uk5jxmC-QMchlTgsjSgsk',{method:'POST',headers:{'Content-Type':'application/json'},body,credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer',signal:controller.signal});body=null;
  if(!response.ok)throw Error('SIGN_IN_FAILED');
  let identity=await response.json();session=await rpc('login',{idToken:identity.idToken});identity=null;
  await rpc('touch',{token:session.token});
  form.hidden=true;logout.hidden=false;status.textContent='LOGIN PASS — your approved LIVE account is verified. Please sign out to finish this check.';
 }catch(error){status.textContent='Login check stopped: '+error.message+'.';}
 finally{clearTimeout(timer);submit.disabled=false;}
});
logout.addEventListener('click',async()=>{
 logout.disabled=true;status.textContent='Signing out…';
 try{await rpc('logout',{token:session.token});
  let rejected=false;try{await rpc('touch',{token:session.token});}catch(e){if(e.message==='AUTH_REQUIRED')rejected=true;else throw e;}
  if(!rejected)throw Error('SESSION_REVOCATION_FAILED');
  session=null;logout.hidden=true;form.hidden=false;status.textContent='LOGIN + LOGOUT PASS — the previous session is rejected. No event data changed.';
 }catch(e){status.textContent='Sign-out check stopped: '+e.message+'. Retry Sign out.';}finally{logout.disabled=false;}
});
window.addEventListener('pageshow',e=>{if(e.persisted)location.reload();});
</script></body></html>
